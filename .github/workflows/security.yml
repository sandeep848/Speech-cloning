name: Security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0 bandit==1.8.6
      - run: python -m pip_audit -r backend/requirements-test.txt
      - name: Generate dependency SBOM for resolved API/test environment
        run: python -m pip_audit -r backend/requirements-test.txt --format cyclonedx-json --output api-sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-dependency-sbom
          path: api-sbom.json
      - run: python -m bandit -r backend -x backend/tests -lll -iii
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
