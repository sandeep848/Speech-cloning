name: Verify
on:
  push:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    uses: ./.github/workflows/backend.yml
  frontend:
    uses: ./.github/workflows/frontend.yml
  models:
    uses: ./.github/workflows/models.yml
  contracts:
    uses: ./.github/workflows/contracts.yml
  security:
    uses: ./.github/workflows/security.yml
  final-check:
    name: Final checks
    if: always()
    needs: [backend, frontend, models, contracts, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled or skipped components
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
      - uses: actions/checkout@v4
      - name: Record revision and build provenance
        env:
          BUILD_ACTOR: ${{ github.actor }}
          BUILD_EVENT: ${{ github.event_name }}
        run: python scripts/release_manifest.py > verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: verification.json
