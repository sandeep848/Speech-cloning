name: Integration and recovery checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Verify API orchestration, session replay, cancellation and restart storage
        run: python -m pytest backend/tests/test_api.py backend/tests/test_boundaries.py -q --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: reports/
