name: Model and evaluation checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest backend/tests/test_pacing.py backend/tests/test_performance.py backend/tests/test_speech.py -q --junitxml=reports/models.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-results
          path: reports/
